version: v2
modules:
  - path: api/proto
lint:
  use:
    - STANDARD
  except:
    # AgentMessage/HubMessage are intentionally named for what they carry
    # (agent->hub, hub->agent), not after the RPC method.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
